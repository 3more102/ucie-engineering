name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run core unit tests
        working-directory: mcp-server
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q mcp-server/ucie_mcp skill/ucie-engineering/scripts scripts
      - name: Validate JSON manifests and examples
        run: |
          python -c "import json,pathlib; files=list(pathlib.Path('.').rglob('*.json')); [json.loads(p.read_text(encoding='utf-8')) for p in files if '.git' not in p.parts]; print(f'Validated {len(files)} JSON files')"
      - name: Build Claude Skill and source archives
        run: python scripts/build_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and package MCPB with official CLI
        run: |
          npm install -g @anthropic-ai/mcpb
          mcpb validate mcp-server/manifest.json
          mcpb pack mcp-server dist/ucie-engineering.mcpb
      - name: Refresh checksums after final MCPB packaging
        run: python scripts/write_checksums.py
      - uses: astral-sh/setup-uv@v5
        if: matrix.python-version == '3.11'
        with:
          enable-cache: true
      - name: Install and smoke-test MCP runtime
        if: matrix.python-version == '3.11'
        working-directory: mcp-server
        run: |
          uv sync
          uv run python -c "from ucie_mcp.server import mcp; print('MCP package import and tool registration OK')"
          uv run python - <<'PY'
          import importlib.util
          from pathlib import Path
          server_path = Path("ucie_mcp/server.py")
          spec = importlib.util.spec_from_file_location("server_module", server_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.mcp is not None
          print("MCP Inspector direct-file import OK")
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: ucie-engineering-v1.3.1
          path: |
            dist/ucie-engineering-skill.zip
            dist/ucie-engineering.mcpb
            dist/ucie-claude-engineering-source.zip
            dist/SHA256SUMS.txt
